server:
  port: 8080

spring:
  application:
    name: credexplain-core-backend
  datasource:
    url: jdbc:h2:file:./data/credexplaindb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

ml:
  service:
    url: http://localhost:8000
